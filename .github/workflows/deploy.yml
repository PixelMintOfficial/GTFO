name: "Export and Deploy Godot Web Game"

# Disabled: it ran on every push to main, but it builds with Godot 4.3 (the game is 4.7.2) and publishes to
# GitHub Pages, which rejects files over 100 MB (the web build's data file is ~148 MB). The live site is
# deployed to Vercel instead (see AGENTS.md, section 2). It can still be started by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export_web:
    runs-on: ubuntu-latest
    name: Export Web Game
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Godot Web Export
        uses: abarbieux/godot-export@v5.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
